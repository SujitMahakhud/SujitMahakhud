<svg width="1920" height="400" viewBox="0 0 1920 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF00FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF00FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1920" height="400" fill="url(#bgGradient)"/>
  <rect width="1920" height="400" fill="url(#grid)"/>
  <line x1="0" y1="100" x2="1920" y2="100" stroke="url(#accentGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="300" x2="1920" y2="300" stroke="url(#accentGradient)" stroke-width="2" opacity="0.3"/>
  <g stroke="#00D9FF" stroke-width="3" fill="none" opacity="0.7">
    <polyline points="50,50 50,80 80,80"/>
    <polyline points="50,50 80,50"/>
    <polyline points="1870,50 1870,80 1840,80"/>
    <polyline points="1870,50 1840,50"/>
    <polyline points="50,350 50,320 80,320"/>
    <polyline points="50,350 80,350"/>
    <polyline points="1870,350 1870,320 1840,320"/>
    <polyline points="1870,350 1840,350"/>
  </g>
  <g opacity="0.15" fill="none" stroke="#FF00FF" stroke-width="2">
    <polygon points="200,80 230,95 230,125 200,140 170,125 170,95" transform="rotate(15 200 110)"/>
    <polygon points="1700,250 1730,265 1730,295 1700,310 1670,295 1670,265" transform="rotate(-20 1700 280)"/>
    <polygon points="900,50 930,65 930,95 900,110 870,95 870,65" transform="rotate(10 900 80)"/>
  </g>
  <text x="960" y="160" font-family="'Courier New', monospace" font-size="72" font-weight="bold" fill="url(#textGradient)" text-anchor="middle" filter="url(#glow)">SUJIT MAHAKHUD</text>
  <text x="960" y="220" font-family="'Courier New', monospace" font-size="36" fill="#00D9FF" text-anchor="middle" opacity="0.9">&gt; OFFENSIVE SECURITY &amp; SENTINEL TINKERER_</text>
  <line x1="600" y1="240" x2="1320" y2="240" stroke="#FF00FF" stroke-width="1" opacity="0.5"/>
  <text x="960" y="285" font-family="'Courier New', monospace" font-size="18" fill="#C9D1D9" text-anchor="middle" opacity="0.7">Security Delivery Senior Analyst | Azure Security Engineer (AZ-500) | Sentinel Specialist</text>
  <g opacity="0.3">
    <circle cx="150" cy="200" r="3" fill="#00D9FF"/>
    <circle cx="1770" cy="200" r="3" fill="#FF00FF"/>
    <circle cx="480" cy="120" r="2" fill="#00D9FF"/>
    <circle cx="1440" cy="280" r="2" fill="#FF00FF"/>
  </g>
</svg>
